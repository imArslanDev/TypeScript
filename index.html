<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeScript</title>
    <script defer type="module" src="./dist/17-Interface-In-Class.js"></script>
  </head>
  <style>
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
      background-color: #1e1e1e;
      color: beige;
      text-align: center;
    }
    h2 {
      font-size: 34px;
      color: white;
    }
    .main {
      max-width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    form {
      display: flex;
      flex-direction: column;
      max-width: 400px;
      width: 100%;
      justify-content: center;
      gap: 10px;
    }
    input {
      border-radius: 4px;
      padding: 6px 5px;
      border: none;
      outline: none;
      transition: 0.4s ease;
    }
    input:focus {
      border: 3px solid teal;
    }
    button {
      background-color: teal;
      color: white;
      padding: 10px 14px;
      border-radius: 4px;
      border: none;
      outline: none;
      cursor: pointer;
    }
  </style>

</html>
